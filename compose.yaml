services:
  postgres:
    image: postgres:18.3
    container_name: learn-postgresql-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - learn-postgresql-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  learn-postgresql-data:
    name: learn-postgresql-data
