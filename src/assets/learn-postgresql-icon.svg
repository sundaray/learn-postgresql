<!--
  App icon: the elephant's head, cropped out of learn-postgresql-logo.svg.

  The full mark has four separate objects and a lot of hairline detail, none of
  which survives a 16px tab. This is the head, the ears and the trunk only,
  knocked out of a solid tile so the icon keeps a stable footprint on a light or
  a dark tab strip.

  Three edits were made to the shapes taken from the logo:

  1. The mouth, the lip and the arm of the glasses were cut out of the ear/trunk
     contour. In the logo those are line art drawn over an outlined figure. With
     the outlines gone they read as chips out of the silhouette instead.
  2. The outlines themselves are dropped. The tile behind the mark supplies the
     contrast, and the gaps between shapes draw the ear seams and the glasses.
  3. The frame is centred on the artwork bounds (390..1480 by 213..1083) and is
     wide enough to keep the whole trunk curl, which is what makes the shape
     read as an elephant rather than a blob with an ear.

  scripts/generate-favicons.mjs renders every icon in public/ from this file.
-->
