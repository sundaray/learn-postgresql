<!--
  App icon, supplied as artwork: the elephant mark, drawn with no backdrop.

  Dropped in from learn-postgresql-favicon.svg, with three edits:

  1. The full-canvas white rectangle behind the mark was deleted, so the icon is
     transparent and sits on whatever the tab strip or home screen provides.
  2. The root tag keeps only viewBox. The fixed width/height, the inline display
     style and preserveAspectRatio="none" were removed so the renderer can size
     the icon freely.
  3. The frame was pulled in from the original 0 0 2048 2048. The mark occupies
     272..1785 by 401..1545 of that canvas, so roughly a quarter of every edge
     was empty. The box here is the smallest square centred on those bounds with
     a margin left around them, which buys back the pixels that matter at 16px.

  scripts/generate-favicons.mjs renders every icon in public/ from this file.
-->
